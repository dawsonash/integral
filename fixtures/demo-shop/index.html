<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hoodie Shop</title>
<link rel="stylesheet" href="shop.css">
</head>
<body>
<header><h1>Hoodie Shop</h1><a href="cart.html" id="cart-link">Cart (<span id="cart-count">0</span>)</a></header>
<main>
  <p class="tagline">Fresh fits, zero fluff.</p>
  <div class="grid">
    <div class="product">
      <div class="swatch blue"></div>
      <h2>Blue Hoodie</h2>
      <p>$49</p>
      <button class="add" data-item="blue">Add to cart</button>
    </div>
    <div class="product">
      <div class="swatch red"></div>
      <h2>Red Hoodie</h2>
      <p>$49</p>
      <button class="add" data-item="red">Add to cart</button>
    </div>
    <div class="product">
      <div class="swatch green"></div>
      <h2>Green Hoodie</h2>
      <p>$54</p>
      <button class="add" data-item="green">Add to cart</button>
    </div>
  </div>
  <section class="promo">
    <h2>Why hoodies?</h2>
    <p>Because meetings are cold and standups are long. Scroll down for our story.</p>
    <div class="filler">…</div>
    <p>Est. 2026. Made with recycled fleece.</p>
  </section>
</main>
<script src="shop.js"></script>
</body>
</html>
