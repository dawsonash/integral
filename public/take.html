<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Usability test</title>
<link rel="icon" href="/favicon.png" sizes="64x64">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
<style>
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; }
  #gate {
    flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  #gate .card { max-width: 440px; width: 100%; }
  /* Not a link: the run host serves tests only, never the marketing site. */
  .gate-brand { font-weight: 700; font-size: 15px; margin-bottom: 12px; }
  .gate-brand span { color: var(--accent); }
  .gate-task {
    margin-top: 16px; padding: 12px 14px;
    background: var(--bg); border-radius: 8px;
  }
  .gate-task b {
    display: block; font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .05em; color: var(--muted); margin-bottom: 3px;
  }
  /* The button used to inherit its breathing room from the consent copy above. */
  #gate .card #consent { margin-top: 26px; }
  /* Fine print under the button: quiet, and clearly not part of the decision. */
  .gate-links { margin: 18px 0 0; display: flex; gap: 16px; font-size: 13px; }
  #gate .card.gate-closed { width: auto; max-width: 380px; text-align: center; }
  #gate .card.gate-closed h2 { margin: 0; }
  #taskbar {
    display: none; background: #1a1a2e; color: #fff; padding: 10px 16px;
    align-items: center; gap: 14px; flex-wrap: wrap;
  }
  /* A wrapper, not a layer: on a wide screen it lays its children out exactly
     as the bar itself used to, so the desktop taskbar is unchanged. */
  #taskpanel { display: flex; flex: 1; align-items: center; gap: 14px; flex-wrap: wrap; }
  #taskbar .prompt { flex: 1; min-width: 200px; font-size: 14px; }
  #taskbar .prompt b { color: #fdba74; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; display: block; }
  /* Both are the collapsed-on-mobile treatment only. */
  #taskfab, #taskpanel .tryint { display: none; }
  #stage { flex: 1; display: none; position: relative; }
  #appframe { width: 100%; height: 100%; border: 0; display: block; }
  #overlay {
    display: none; position: fixed; inset: 0; background: rgba(20,20,40,.55);
    align-items: center; justify-content: center; z-index: 50; padding: 20px;
  }
  #overlay .card { max-width: 460px; width: 100%; }
  .seq-scale { display: flex; gap: 6px; margin: 10px 0; }
  .seq-scale button { flex: 1; padding: 10px 0; font-size: 15px; }
  .seq-scale button.sel { background: var(--accent); color: #fff; border-color: var(--accent); }
  .seq-ends { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
  #giveup { background: none; border-color: #3f3f5e; color: #c7c7d9; font-size: 13px; }

  /* On a phone the bar spent a fifth of the viewport on two lines that never
     change, and the app under test — the thing being measured — got what was
     left. Same element, re-laid as a control that floats over the app and
     collapses out of the way. The taker has just read the task on the consent
     gate, so it opens closed. */
  @media (max-width: 640px) {
    #taskbar {
      position: fixed; z-index: 40; left: auto; right: 12px;
      bottom: calc(12px + env(safe-area-inset-bottom, 0px));
      padding: 0; background: none;
      /* Panel above the button it belongs to, without moving either in the
         DOM — the toggle should still come first for a screen reader. */
      flex-direction: column-reverse; align-items: flex-end; gap: 8px;
    }
    #taskfab {
      display: flex; align-items: center; gap: 7px;
      padding: 11px 16px; border: 0; border-radius: 999px;
      background: #1a1a2e; color: #fff; font-size: 14px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, .35);
    }
    #taskfab .mark { color: #fdba74; }
    #taskpanel {
      display: none; width: min(78vw, 320px);
      flex-direction: column; align-items: stretch; gap: 12px;
      padding: 14px; border-radius: 12px; background: #1a1a2e;
      box-shadow: 0 6px 22px rgba(0, 0, 0, .4);
    }
    #taskbar.open #taskpanel { display: flex; }
    /* The desktop bar's 200px floor would force the panel wider than the phone. */
    #taskbar .prompt { flex: none; min-width: 0; }
    #giveup { width: 100%; }
    #taskpanel .tryint {
      display: block; text-align: center; font-size: 12px; color: #a5a5bb;
    }
  }
</style>
</head>
<body>
  <div id="gate"><div class="card" id="gatecard">Loading…</div></div>
  <div id="taskbar">
    <button id="taskfab" aria-expanded="false" aria-controls="taskpanel">
      <span class="mark" aria-hidden="true">◱</span><span id="fablabel">Your task</span>
    </button>
    <div id="taskpanel">
      <div class="prompt"><b id="taskbarlabel">Your task</b><span id="taskprompt"></span></div>
      <button id="giveup">I couldn't do it — give up</button>
      <a class="tryint" id="tryintegralbar" target="_blank" rel="noopener">Try Integral</a>
    </div>
  </div>
  <div id="stage"><iframe id="appframe" title="App under test"></iframe></div>
  <div id="overlay"><div class="card" id="overlaycard"></div></div>
<script src="/take.js"></script>
</body>
</html>
